name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — the release-integrity hardening item)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Golden corpus (generated, never committed; ADR 010)
        # Python's models of pramana 1.3.0 write tests/golden/<module>.tsv; validate.py checks every row and writes
        # the correctly rounded, reference and mapped rows (MPFR, through ctypes) that the replay holds the port to.
        # scripts/golden/digests.txt holds the dev box's digests (glibc 2.44, x86_64, FMA): a runner whose libm gives
        # other bits fails here, before the replay. gen.py fetches NIST StRD's sets into build/strd/ (pinned by sha256).
        # The full corpus replays on x86_64 ELF in `cyrius test`; PE and aarch64 are the local gates' (wine, qemu).
        run: |
          sudo apt-get install -y --no-install-recommends libmpfr6
          python3 -I -B scripts/golden/gen.py .
          python3 -I -B scripts/golden/validate.py . --write-cr
          python3 -I -B scripts/golden/gen.py . --digests

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Test (bounds-checked)
        run: cyrius test --bounds

      - name: Lockfile matches lib/
        run: cyrius deps --locked

      - name: Audit (fmt, lint, test, bench)
        run: cyrius audit

      - name: Conversion ledger (every stand-in marked, every note on a ledger row)
        run: python3 -I -B scripts/upstream_ledger.py --check

      - name: Surface parity (every public item of a ported 1.3.0 module has its port)
        run: python3 -I -B scripts/surface_parity.py --check

      - name: Rust-test ledger (every 1.3.0 test carried over or retired, docs/development/rust-test-ledger.md current)
        run: python3 -I -B scripts/rust_test_ledger.py --check

      - name: Examples (docs/examples, compiled and run)
        run: |
          set -e
          mkdir -p build
          for e in docs/examples/*.cyr; do
            n=$(basename "$e" .cyr)
            cyrius build "$e" "build/example_$n"
            "./build/example_$n" > /dev/null
            echo "ok: $n"
          done

      - name: Bundle current (dist/pramana.cyr is what distlib writes from [lib])
        run: cyrius distlib --check

      - name: Vendored primitives current (src/crmath*.cyr; unverified without ../kimiya)
        run: python3 -I -B scripts/vendor_crmath.py . --check

      - name: Multi-word constants (src/crmath_ext.cyr, src/crerf.cyr) against their definitions
        run: python3 -I -B scripts/crverify/consts.py .

      - name: Vendored printer current (src/fmtf.cyr; unverified without ../impetus)
        run: python3 -I -B scripts/vendor_fmtf.py . --check

      - name: CORE-MATH erf/erfc tables current (src/crerf*.cyr; unverified without build/coremath/)
        run: python3 -I -B scripts/vendor_coremath.py . --check

      - name: fdlibm lgamma coefficients current (src/lgamma*.cyr; unverified without the libm 0.2.16 source)
        run: python3 -I -B scripts/vendor_lgamma.py . --check

      - name: ζ(k) table current and inline words proven (src/zeta_data.cyr, src/dd.cyr, src/gammainc.cyr, src/betainc.cyr; MPFR)
        run: python3 -I -B scripts/gen_zeta.py . --check
