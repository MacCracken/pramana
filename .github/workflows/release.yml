name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -eo pipefail

jobs:
  verify:
    name: Version and CI status
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read     # this commit's CI runs
      contents: read
    outputs:
      ci-passed: ${{ steps.ci.outputs.passed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — the release-integrity hardening item)

      - name: Verify version consistency
        # VERSION is the single source of truth; cyrius.cyml derives it via version = "${file:VERSION}". Both must
        # equal the pushed tag (as in patra and sigil). This runs first, so a wrong tag fails in seconds.
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyml: $CYML_RAW)"

      - name: This commit's CI run on main
        id: ci
        # CI already ran on this commit when it was pushed to main. A passing run is reused, not repeated. A run still
        # going (a tag pushed with its commit) is waited for, up to 45 minutes. With no passing run (a commit that
        # never reached main, or a failed or cancelled run), the ci job below runs the full CI here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=20"
          for _ in $(seq 90); do
            runs=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url")
            passed=$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].html_url // empty' <<< "$runs")
            if [ -n "$passed" ]; then
              echo "CI passed on $GITHUB_SHA: $passed"
              echo "passed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            running=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<< "$runs")
            [ "$running" -gt 0 ] || break
            echo "CI is still running on $GITHUB_SHA; checking again in 30 s"
            sleep 30
          done
          echo "No passing CI run on $GITHUB_SHA: the release runs CI itself"
          echo "passed=false" >> "$GITHUB_OUTPUT"

  ci:
    name: CI Gate
    needs: [verify]
    if: needs.verify.outputs.ci-passed != 'true'
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [verify, ci]
    # ci is skipped when verify found a passing run for this commit.
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # the GitHub release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — the release-integrity hardening item)

      - uses: ./.github/actions/setup-cyrius

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Extract changelog
        # Pull the tagged section out of CHANGELOG.md for the release body.
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY=$(awk "/^## \\[$TAG\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          [ -n "$BODY" ] || BODY="No changelog entry for $TAG."
          echo "$BODY" > /tmp/release-body.md

      - name: Source tarball + checksums
        # The source tarball + SHA256SUMS are what `cyrius deps` fetches and sha256-verifies downstream — without them
        # this project cannot be consumed as a dependency. This is the release artifact, not just the built binary.
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${{ github.event.repository.name }}"
          git archive --format=tar.gz --prefix="$NAME-$TAG/" -o "$NAME-$TAG.tar.gz" HEAD
          sha256sum "$NAME-$TAG.tar.gz" build/"$NAME" > SHA256SUMS 2>/dev/null \
            || sha256sum "$NAME-$TAG.tar.gz" > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (pinned — the release-integrity hardening item)
        with:
          name: "${{ github.event.repository.name }} ${{ github.ref_name }}"
          body_path: /tmp/release-body.md
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz
            SHA256SUMS
            build/${{ github.event.repository.name }}
