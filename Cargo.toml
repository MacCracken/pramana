[package]
name = "pramana"
version = "1.3.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
description = "pramana — Statistics and probability: distributions, Bayesian inference, hypothesis testing, Monte Carlo, Markov chains"
repository = "https://github.com/MacCracken/pramana"
readme = "README.md"
documentation = "https://docs.rs/pramana"
keywords = ["statistics", "probability", "bayesian", "distribution", "monte-carlo"]
categories = ["mathematics", "science"]
exclude = [".claude/", ".github/", "docs/", "scripts/"]

[dependencies]
hisab = { version = "1.4", default-features = false, features = ["num"] }
hoosh = { version = "1.3", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["rt"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1.0.154"

[features]
default = []
soorat-compat = []
# Reserved: pramana does no logging. Kept as a no-op so `features = ["logging"]` keeps building.
logging = []
ai = ["dep:hoosh", "dep:tokio", "dep:serde_json"]
# Hidden, read-only hooks for the Cyrius port's golden-value generator
# (docs/development/pramana-port-plan.md, M0 step 0). Not public API; never published.
oracle = []

[[bench]]
name = "benchmarks"
harness = false
