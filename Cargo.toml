[package]
name = "pramana"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "pramana — Statistics and probability: distributions, Bayesian inference, hypothesis testing, Monte Carlo, Markov chains"
homepage = "https://github.com/MacCracken/pramana"
repository = "https://github.com/MacCracken/pramana"
readme = "README.md"
documentation = "https://docs.rs/pramana"
keywords = ["statistics", "probability", "bayesian", "distribution", "monte-carlo"]
categories = ["mathematics", "science"]
exclude = [".claude/", ".github/", "docs/", "scripts/"]

[dependencies]
hisab = { version = "1", path = "../hisab", default-features = false, features = ["num"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[features]
default = []
logging = ["dep:tracing-subscriber"]

[[bench]]
name = "benchmarks"
harness = false
